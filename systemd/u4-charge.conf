# Конфигурация демона управления зарядом Gigabyte U4 UD / RC14UD
# Допустимые значения START_THRESHOLD: 40, 50, 60, 70, 80, 95
# Допустимые значения END_THRESHOLD:   60, 70, 80, 90, 100 (строго START < END)
START_THRESHOLD=60
END_THRESHOLD=80

# Автоматическая балансировка отключена по умолчанию (0).
# При BALANCE_INTERVAL_DAYS > 0 уведомление лишь предложит калибровку (без скрытой зарядки).
BALANCE_INTERVAL_DAYS=0
BALANCE_SOAK_MINUTES=90

# Таймаут безопасности для разовой зарядки до 100% (FullOnce), в часах
FULL_TIMEOUT_HOURS=6

# Показывать интерактивное уведомление KDE при входе в сессию
NOTIFY_ON_START=true
